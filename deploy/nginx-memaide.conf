# Nginx reverse proxy for MemAide, terminating TLS in front of the session server.
# ONE cert fronts BOTH services the session server hosts (scripts/run_session_server.py):
#
#   wss://YOUR_DOMAIN/            -> 127.0.0.1:8765  (glasses/phone media WebSocket)
#   https://YOUR_DOMAIN/infer     -> 127.0.0.1:8080  (koko backend bridge, server-to-server)
#   https://YOUR_DOMAIN/session/  -> 127.0.0.1:8080  (Slice 2 /session/start)
#   https://YOUR_DOMAIN/health    -> 127.0.0.1:8080  (health check)
#   https://YOUR_DOMAIN/preview/  -> 127.0.0.1:8000  (vision live preview, optional)
#
# You need a DOMAIN NAME for TLS: Let's Encrypt will not issue a cert for a bare IP,
# and browsers/mobile require wss:// (secure) in production. If you only have the IP
# 67.205.153.42 and are just testing, skip Nginx and connect straight to ws://IP:8765
# (open port 8765 in ufw). Move to this config once a domain points at the droplet.
#
# guardianova.com already exists (koko's portal is live at caregiver.guardianova.com),
# so you don't need a new registrar -- just a SUBDOMAIN A record for THIS droplet
# (e.g. ai.guardianova.com -> 67.205.153.42), which koko adds since he owns DNS.
#
# Setup (standalone-cert flow — get the cert BEFORE wiring nginx, so the `listen 443 ssl`
# block below is never live without a certificate; `certbot --nginx` cannot help here
# because `nginx -t` fails on `listen 443 ssl` with no ssl_certificate defined):
#   1. Have koko point a subdomain A record (e.g. ai.guardianova.com) at 67.205.153.42;
#      confirm with `dig +short ai.guardianova.com`.
#   2. Issue the cert with nginx NOT yet holding :80 (standalone binds :80 itself):
#        sudo systemctl stop nginx 2>/dev/null || true
#        sudo certbot certonly --standalone -d ai.guardianova.com \
#             --non-interactive --agree-tos -m you@example.com
#   3. sudo cp deploy/nginx-memaide.conf /etc/nginx/sites-available/memaide
#   4. Replace YOUR_DOMAIN AND uncomment the two ssl_certificate lines below (they now
#      exist under /etc/letsencrypt/live/ai.guardianova.com/). One sed does both:
#        sudo sed -i -e 's/YOUR_DOMAIN/ai.guardianova.com/g' \
#                    -e 's/^\( *\)# \(ssl_certificate\)/\1\2/' \
#                    /etc/nginx/sites-available/memaide
#   5. sudo rm -f /etc/nginx/sites-enabled/default   # don't let it grab the domain
#      sudo ln -s /etc/nginx/sites-available/memaide /etc/nginx/sites-enabled/memaide
#      sudo nginx -t && sudo systemctl restart nginx
#   6. Point koko's AI_AGENT_URL at https://YOUR_DOMAIN (was http://67.205.153.42:8080)
#      and Arian's app at wss://YOUR_DOMAIN/ (was ws://67.205.153.42:8765).

# --- Redirect plain HTTP to HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name YOUR_DOMAIN;

    # certbot fills these in; placeholders so `nginx -t` documents what's needed.
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # Glasses send base64 frames + audio as JSON text frames; give WS headroom.
    client_max_body_size 25m;

    # --- koko backend bridge + Slice 2 session control -> session server on 8080 ---
    # Nginx uses longest-prefix match, so these win over `location /` (the WS) below.
    # These carry patient context + the shared X-Api-Key, so TLS here is the whole point:
    # koko is a SEPARATE droplet (134.122.115.15), so /infer crosses the public internet.
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /infer {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /session/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket media stream -> bridge server on 8765 ---
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A live session is a long-lived connection; don't let nginx time it out.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- Vision live preview (optional; lock down or remove for production) ---
    location /preview/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Uncomment to require a login for the preview:
        # auth_basic "MemAide preview";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
}

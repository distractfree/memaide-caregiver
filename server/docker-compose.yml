services:
  postgres:
    image: postgres:15-alpine
    container_name: memaide-postgres
    environment:
      POSTGRES_DB: memaide
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - memaide-postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  memaide-postgres-data:
